<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard - Admin Miniseri</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #0d0a10;
            min-height: 100vh;
            color: #fff;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: linear-gradient(180deg, #1a0f1f 0%, #0d0a10 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
            margin-bottom: 32px;
        }

        .sidebar-logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .sidebar-logo h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .sidebar-logo span {
            font-size: 11px;
            color: #64748b;
            display: block;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(238, 29, 147, 0.15) 0%, rgba(238, 39, 46, 0.15) 100%);
            color: #EE1D93;
        }

        .nav-item .material-symbols-outlined {
            font-size: 20px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: #ef4444;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 32px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(45, 27, 54, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(238, 29, 147, 0.3);
            transform: translateY(-2px);
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.users {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0.1) 100%);
            color: #3b82f6;
        }

        .stat-icon.content {
            background: linear-gradient(135deg, rgba(238, 29, 147, 0.2) 0%, rgba(238, 39, 46, 0.1) 100%);
            color: #EE1D93;
        }

        .stat-icon.transactions {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.1) 100%);
            color: #22c55e;
        }

        .stat-icon.revenue {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(245, 158, 11, 0.1) 100%);
            color: #f59e0b;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Quick Actions */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .action-card {
            background: rgba(45, 27, 54, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .action-card:hover {
            border-color: rgba(238, 29, 147, 0.3);
            transform: translateY(-2px);
            background: rgba(45, 27, 54, 0.6);
        }

        .action-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #EE1D93 0%, #EE272E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-icon .material-symbols-outlined {
            font-size: 28px;
        }

        .action-info h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .action-info p {
            color: #94a3b8;
            font-size: 13px;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(238, 29, 147, 0.2);
            border-top-color: #EE1D93;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="/assets/logo.png" alt="Miniseri">
            <div>
                <h1>Miniseri</h1>
                <span>Admin Panel</span>
            </div>
        </div>

        <nav>
            <div class="nav-section">
                <div class="nav-section-title">Menu</div>
                <a href="/admin/dashboard" class="nav-item active">
                    <span class="material-symbols-outlined">dashboard</span>
                    Dashboard
                </a>
                <a href="/admin/content" class="nav-item">
                    <span class="material-symbols-outlined">movie</span>
                    Kelola Content
                </a>
                <a href="/admin/files" class="nav-item">
                    <span class="material-symbols-outlined">folder</span>
                    Kelola File
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">
                <span class="material-symbols-outlined">logout</span>
                Keluar
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h2>Dashboard</h2>
            <p>Selamat datang di Admin Panel Miniseri</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Quick Actions -->
        <h3 class="section-title">Aksi Cepat</h3>
        <div class="quick-actions">
            <a href="/admin/content" class="action-card">
                <div class="action-icon">
                    <span class="material-symbols-outlined">add_circle</span>
                </div>
                <div class="action-info">
                    <h4>Tambah Content Baru</h4>
                    <p>Buat content baru untuk dijual</p>
                </div>
            </a>
            <a href="/admin/files" class="action-card">
                <div class="action-icon">
                    <span class="material-symbols-outlined">upload_file</span>
                </div>
                <div class="action-info">
                    <h4>Upload File</h4>
                    <p>Tambahkan file ke content</p>
                </div>
            </a>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('adminToken');

        // Check auth
        if (!token) {
            window.location.href = '/admin/login';
        }

        // Verify token
        fetch('/api/admin/verify', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => {
                if (!res.ok) {
                    localStorage.removeItem('adminToken');
                    window.location.href = '/admin/login';
                }
            })
            .catch(() => {
                localStorage.removeItem('adminToken');
                window.location.href = '/admin/login';
            });

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load stats');

                const stats = await response.json();

                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-icon users">
                                <span class="material-symbols-outlined">group</span>
                            </div>
                        </div>
                        <div class="stat-value">${stats.users.toLocaleString()}</div>
                        <div class="stat-label">Total Pengguna</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-icon content">
                                <span class="material-symbols-outlined">movie</span>
                            </div>
                        </div>
                        <div class="stat-value">${stats.contents.toLocaleString()}</div>
                        <div class="stat-label">Total Content</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-icon transactions">
                                <span class="material-symbols-outlined">receipt_long</span>
                            </div>
                        </div>
                        <div class="stat-value">${stats.transactions.toLocaleString()}</div>
                        <div class="stat-label">Transaksi Sukses</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-icon revenue">
                                <span class="material-symbols-outlined">payments</span>
                            </div>
                        </div>
                        <div class="stat-value">Rp ${stats.revenue.toLocaleString()}</div>
                        <div class="stat-label">Total Pendapatan</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <div style="color: #ef4444; text-align: center; grid-column: 1/-1;">
                        Gagal memuat statistik. <a href="javascript:loadStats()" style="color: #EE1D93;">Coba lagi</a>
                    </div>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin/login';
        }

        loadStats();
    </script>
</body>

</html>
